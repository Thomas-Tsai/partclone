name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.55 (no v prefix)'
        required: true
        type: string
      update_po:
        description: 'Also sync po files (heavier: runs autogen+configure)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build everything from the dispatch commit, but do not bump/tag/publish'
        required: false
        type: boolean
        default: false
      cleanup_on_failure:
        description: 'Delete the newly pushed tag if any test/publish job fails (full mode only)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version / tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      prev_tag: ${{ steps.resolve.outputs.prev_tag }}
      mode: ${{ steps.resolve.outputs.mode }}
      bumped: ${{ steps.resolve.outputs.bumped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mode
        id: detect
        env:
          VER: ${{ github.event.inputs.version }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VER' must match X.Y.Z (no v prefix)"
            exit 1
          fi
          if [ "$DRY" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$VER" > /dev/null; then
            TAGVER=$(git show "$VER:configure.ac" | sed -n 's/^AC_INIT(\[Partclone\],\[\([^]]*\)\].*/\1/p')
            if [ "$TAGVER" != "$VER" ]; then
              echo "::error::tag $VER exists but its configure.ac declares $TAGVER"
              exit 1
            fi
            echo "mode=existing" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.detect.outputs.mode == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev perl

      - name: Bump version and regenerate docs
        if: steps.detect.outputs.mode == 'full'
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^AC_INIT(\[Partclone\],\[[^]]*\]/AC_INIT([Partclone],[${VER}]/" configure.ac
          ./toolbox --update-log
          ./toolbox --update-contributors

      - name: Sync po files (optional)
        if: steps.detect.outputs.mode == 'full' && github.event.inputs.update_po == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            build-essential autoconf automake autotools-dev libtool libtool-bin \
            gettext autopoint intltool pkg-config uuid-dev libssl-dev zlib1g-dev libzstd-dev libmount-dev
          ./autogen
          ./configure
          make -C po update-po

      - name: Sync packaging (debian changelog + rpm spec)
        if: steps.detect.outputs.mode == 'full'
        env:
          VER: ${{ github.event.inputs.version }}
          DEBEMAIL: tlinux.tsai@gmail.com
          DEBFULLNAME: Thomas Tsai
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | head -1 || true)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          DEBCHLOG=README.Packages/debian.sid/changelog
          if ! dpkg-parsechangelog -l "$DEBCHLOG" -S Version | grep -qx "${VER}-1~gh1"; then
            {
              echo "partclone (${VER}-1~gh1) sid; urgency=medium"
              echo
              echo "  * Automated upstream release build ${VER} (GitHub Actions)."
              RANGE="${PREV_TAG:+$PREV_TAG..HEAD}"
              git log --no-merges --format='%s (%h)' $RANGE | head -30 | sed 's/^/  * /'
              echo
              echo " -- Thomas Tsai <tlinux.tsai@gmail.com>  $(LC_ALL=C date -R)"
              echo
            } > /tmp/deb_entry
            cat /tmp/deb_entry "$DEBCHLOG" > /tmp/deb_changelog
            mv /tmp/deb_changelog "$DEBCHLOG"
            dpkg-parsechangelog -l "$DEBCHLOG" -S Version | grep -qx "${VER}-1~gh1"
          fi
          SPEC=README.Packages/partclone.spec
          sed -i "s/^Version:.*/Version:      ${VER}/" "$SPEC"
          if ! grep -A3 '^%changelog' "$SPEC" | grep -qF -- "- ${VER}-"; then
            DATE=$(LC_ALL=C date '+%a %b %d %Y')
            {
              echo "* ${DATE} Thomas Tsai <tlinux.tsai@gmail.com> - ${VER}-1.gh1"
              echo "- Automated upstream release build ${VER} (GitHub Actions)."
              echo
            } > /tmp/spec_entry
            sed -i "/^%changelog$/r /tmp/spec_entry" "$SPEC"
          fi
        id: packaging

      - name: Commit, tag and push
        if: steps.detect.outputs.mode == 'full'
        env:
          VER: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configure.ac ChangeLog CONTRIBUTORS \
            README.Packages/debian.sid/changelog README.Packages/partclone.spec
          git add po/*.po po/partclone.pot 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Bump version to ${VER}"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag -a "${VER}" -m "Release ${VER}"
          git push origin "${VER}"

      - name: Resolve outputs
        id: resolve
        env:
          VER: ${{ github.event.inputs.version }}
          MODE: ${{ steps.detect.outputs.mode }}
          PREV: ${{ steps.packaging.outputs.prev_tag }}
        run: |
          set -euo pipefail
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            dry-run)
              echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
              ;;
            existing)
              echo "ref=$VER" >> "$GITHUB_OUTPUT"
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              PREV_TAG=$(git tag --sort=-creatordate | grep -vFx "$VER" | head -1 || true)
              ;;
            full)
              echo "ref=$VER" >> "$GITHUB_OUTPUT"
              echo "bumped=true" >> "$GITHUB_OUTPUT"
              PREV_TAG="$PREV"
              ;;
          esac
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

  test-debian-build:
    name: Test - Debian snapshot build
    needs: prepare
    uses: ./.github/workflows/debian-build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  test-cross-arch:
    name: Test - Cross-arch save/restore
    needs: prepare
    uses: ./.github/workflows/cross-arch-test.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  source-tarball:
    name: Publish - source tarball
    needs: [prepare, test-debian-build, test-cross-arch]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Create source tarball
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=tar.gz --prefix="partclone-${VER}/" \
            -o "export/partclone-${VER}.tar.gz" HEAD
          tar tzf "export/partclone-${VER}.tar.gz" | sed -n '1,3p'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-source
          path: export/*

  deb:
    name: Publish - deb (sid, ${{ matrix.flavor }})
    needs: [prepare, test-debian-build, test-cross-arch]
    runs-on: ubuntu-latest
    container: debian:sid
    strategy:
      fail-fast: false
      matrix:
        flavor: [dynamic, static]
    env:
      VER: ${{ needs.prepare.outputs.version }}
      DEBEMAIL: tlinux.tsai@gmail.com
      DEBFULLNAME: Thomas Tsai
    steps:
      - name: Install basic dependencies
        run: |
          sed -i 's/Components: main/Components: main contrib non-free/g' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper fakeroot git tar ca-certificates curl dpkg-dev lintian equivs

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup Debian packaging directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf debian
          cp -a README.Packages/debian.sid debian

      - name: Add DRBL-core apt repository
        run: |
          curl -fsSL https://drbl.org/GPG-KEY-DRBL -o /etc/apt/trusted.gpg.d/drbl-gpg.asc
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://free.nchc.org.tw/drbl-core' \
            'Suites: drbl' \
            'Components: stable testing unstable dev' \
            'Signed-By: /etc/apt/trusted.gpg.d/drbl-gpg.asc' \
            > /etc/apt/sources.list.d/drbl.sources
          printf '%s\n' \
            'Package: *' \
            'Pin: origin "free.nchc.org.tw"' \
            'Pin-Priority: 100' \
            '' \
            'Package: libufs2 libufs2-dev libvmfs libvmfs0 libvmfs-dev libjfs-dev ufsutils vmfs-tools' \
            'Pin: origin "free.nchc.org.tw"' \
            'Pin-Priority: 600' \
            > /etc/apt/preferences.d/drbl

      - name: Install build dependencies
        run: |
          apt-get update
          mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y' debian/control
          rm -f *build-deps*

      - name: Ensure release changelog entry
        run: |
          set -euo pipefail
          WANT="${VER}-1~gh1"
          TOP=$(dpkg-parsechangelog -l debian/changelog -S Version)
          if [ "$TOP" = "$WANT" ]; then
            echo "changelog already at $WANT"
          else
            PREV=$(git tag --sort=-creatordate | grep -vFx "${VER}" | head -1 || true)
            {
              echo "partclone (${WANT}) sid; urgency=medium"
              echo
              echo "  * Automated upstream release build ${VER} (GitHub Actions)."
              RANGE="${PREV:+$PREV..HEAD}"
              git log --no-merges --format='%s (%h)' $RANGE | head -30 | sed 's/^/  * /'
              echo
              echo " -- Thomas Tsai <tlinux.tsai@gmail.com>  $(LC_ALL=C date -R)"
              echo
            } > /tmp/deb_entry
            cat /tmp/deb_entry debian/changelog > /tmp/deb_changelog
            mv /tmp/deb_changelog debian/changelog
            dpkg-parsechangelog -l debian/changelog -S Version | grep -qx "$WANT"
          fi
          head -12 debian/changelog

      - name: Create orig tarball
        run: |
          git archive --format=tar.gz --prefix="partclone-${VER}/" \
            -o "../partclone_${VER}.orig.tar.gz" HEAD
          tar -O -xf "../partclone_${VER}.orig.tar.gz" "partclone-${VER}/src/version.h" > src/version.h || true

      - name: Build Debian package (dynamic)
        if: matrix.flavor == 'dynamic'
        run: dpkg-buildpackage -us -uc -sa

      - name: Build Debian package (static)
        if: matrix.flavor == 'static'
        env:
          DEB_BUILD_OPTIONS: static
          PARTCLONE_STATIC: 1
        run: dpkg-buildpackage -us -uc -sa

      - name: Run lintian
        run: lintian -i -I --show-overrides ../*.deb ../*.dsc || echo "::warning::lintian reported issues"

      - name: Prepare artifacts
        run: |
          mkdir -p export
          mv ../partclone_* export/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-deb-${{ matrix.flavor }}
          path: export/*

  rpm:
    name: Publish - rpm (fedora)
    needs: [prepare, test-debian-build, test-cross-arch]
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install basic dependencies
        run: dnf install -y git tar gzip rpm-build rpmdevtools

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Ensure spec version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SPEC=README.Packages/partclone.spec
          TOPV=$(sed -n 's/^Version:[[:space:]]*//p' "$SPEC" | head -1)
          if [ "$TOPV" != "${VER}" ]; then
            sed -i "s/^Version:.*/Version:      ${VER}/" "$SPEC"
          fi
          if ! grep -A3 '^%changelog' "$SPEC" | grep -qF -- "- ${VER}-"; then
            DATE=$(LC_ALL=C date '+%a %b %d %Y')
            {
              echo "* ${DATE} Thomas Tsai <tlinux.tsai@gmail.com> - ${VER}-1.gh1"
              echo "- Automated upstream release build ${VER} (GitHub Actions)."
              echo
            } > /tmp/spec_entry
            sed -i "/^%changelog$/r /tmp/spec_entry" "$SPEC"
          fi
          cp "$SPEC" /tmp/partclone.spec

      - name: Install spec build dependencies
        run: dnf builddep -y /tmp/partclone.spec || dnf install -y autoconf automake libtool gettext-devel pkgconf gcc make e2fsprogs-devel xfsprogs-devel libuuid-devel libblkid-devel libzstd-devel zlib-devel openssl-devel ncurses-devel lz4-devel userspace-rcu-devel xxhash-devel libtirpc-devel systemd-devel ntfs-3g-devel libxslt docbook-style-xsl

      - name: Build rpm
        run: |
          set -euo pipefail
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive --format=tar.gz --prefix="partclone-${VER}/" \
            -o "rpmbuild/SOURCES/partclone-${VER}.tar.gz" HEAD
          cp /tmp/partclone.spec rpmbuild/SPECS/
          rpmbuild --define "_topdir $PWD/rpmbuild" -ba rpmbuild/SPECS/partclone.spec
          mkdir -p export
          find rpmbuild/RPMS -name '*.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' -exec cp {} export/ \;
          cp rpmbuild/SRPMS/*.src.rpm export/
          ls -la export/

      - name: Smoke test rpm
        run: |
          set -euo pipefail
          dnf install -y export/partclone-*.rpm
          ls /usr/sbin/partclone.* | head -5
          file /usr/sbin/partclone.extfs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm
          path: export/*.rpm

  static-tarball:
    name: Publish - static tarball
    needs: [prepare, test-debian-build, test-cross-arch]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install dependencies
        run: |
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y partclone
          sudo apt-get install -y build-essential autoconf automake autotools-dev libtool libtool-bin gettext autopoint intltool pkg-config \
            uuid-dev libssl-dev zlib1g-dev libzstd-dev libblkid-dev
          sudo apt-get install -y ntfs-3g f2fs-tools hfsprogs exfatprogs gddrescue libxxhash-dev libisal-dev liburcu-dev btrfs-progs
          sudo apt-get install -y libjitterentropy3-dev || echo "::warning::libjitterentropy3-dev not available, static build may fail"

      - name: Build static binaries
        run: |
          set -euo pipefail
          ./autogen
          ./configure --enable-fs-test --enable-feature-test --enable-extfs --enable-ntfs \
            --enable-fat --enable-exfat --enable-hfsp --enable-apfs --enable-btrfs \
            --enable-minix --enable-f2fs --enable-reiser4 --enable-xfs --enable-xxhash \
            --enable-isal --enable-static-linking
          make -j"$(nproc)"

      - name: Verify static linkage
        run: |
          set -euo pipefail
          file src/partclone.extfs
          if ! file src/partclone.extfs | grep -q "statically linked"; then
            echo "::error::partclone.extfs is not statically linked"
            exit 1
          fi

      - name: Package tarball
        run: |
          set -euo pipefail
          DIR="partclone-${VER}-static-linux-amd64"
          mkdir -p export "$DIR"
          find src -maxdepth 1 -type f -name 'partclone.*' -executable -exec cp {} "$DIR/" \;
          cp README.md COPYING "$DIR/" 2>/dev/null || true
          ls "$DIR"
          tar -czf "export/${DIR}.tar.gz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-static-tarball
          path: export/*

  appimage:
    name: Publish - AppImage
    needs: [prepare, test-debian-build, test-cross-arch, static-tarball]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download static binaries
        uses: actions/download-artifact@v4
        with:
          name: pkg-static-tarball

      - name: Generate icon
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import struct, zlib, base64
          w = h = 64
          raw = b''.join(b'\x00' + b'\x36\x6d\xa4' * w for _ in range(h))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw))
                 + chunk(b'IEND', b''))
          open('partclone.png', 'wb').write(png)
          EOF
          file partclone.png

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          tar xzf partclone-${VER}-static-linux-amd64.tar.gz
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp partclone-${VER}-static-linux-amd64/partclone.* "$APPDIR/usr/bin/"
          cp partclone.png "$APPDIR/partclone.png"
          cat > "$APPDIR/partclone.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=partclone
          Comment=Clone and restore partitions
          Exec=partclone
          Icon=partclone
          Categories=System;
          Terminal=true
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          BIN="$HERE/usr/bin"
          BASE="$(basename "$0")"
          case "$BASE" in
            AppRun|partclone|*.AppImage)
              if [ $# -ge 1 ] && [ -x "$BIN/$1" ]; then
                TOOL="$1"; shift
                exec "$BIN/$TOOL" "$@"
              fi
              echo "partclone AppImage - usage:"
              echo "  $0 <tool> [args...]   run a tool, e.g. $0 partclone.extfs -h"
              echo "available tools:"
              ls "$BIN"
              exit 1
              ;;
            *)
              exec "$BIN/$BASE" "$@"
              ;;
          esac
          EOF
          chmod +x "$APPDIR/AppRun"
          ( cd "$APPDIR"
            for f in usr/bin/partclone.*; do
              [ -f "$f" ] && ln -sf AppRun "$(basename "$f")"
            done )

      - name: Build AppImage
        run: |
          set -euo pipefail
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p export
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "export/partclone-${VER}-x86_64.AppImage"
          ls -la export/

      - name: Smoke test AppImage
        run: |
          set -euo pipefail
          chmod +x "export/partclone-${VER}-x86_64.AppImage"
          "export/partclone-${VER}-x86_64.AppImage" --appimage-extract-and-run partclone.dd -h || true
          "export/partclone-${VER}-x86_64.AppImage" --appimage-extract-and-run | head -5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-appimage
          path: export/*.AppImage

  docker-image:
    name: Publish - Docker Hub image
    needs: [prepare, test-debian-build, test-cross-arch]
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      push: ${{ !inputs.dry_run }}
    secrets: inherit

  release:
    name: GitHub Release
    needs: [prepare, source-tarball, deb, rpm, static-tarball, appimage, docker-image]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
      PREV: ${{ needs.prepare.outputs.prev_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cd ..
          {
            echo "Partclone ${VER}"
            echo
            echo "> Note: the dynamically linked .deb (amd64) enables ufs/vmfs/jfs via libraries"
            echo "> from the DRBL-core APT repo; use partclone-static or the AppImage without it."
            echo "> See RELEASING.md for details."
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --format='* %s (%h)' "${PREV}..${VER}" | head -100
            else
              git log --no-merges -20 --format='* %s (%h)'
            fi
          } > release_notes.md
          cat release_notes.md | head -15
          ls dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          name: Partclone ${{ env.VER }}
          body_path: release_notes.md
          files: dist/*
          make_latest: true

  cleanup:
    name: Cleanup tag on failure
    if: >-
      ${{ always() && failure() &&
         needs.prepare.outputs.bumped == 'true' &&
         inputs.cleanup_on_failure }}
    needs:
      - prepare
      - test-debian-build
      - test-cross-arch
      - source-tarball
      - deb
      - rpm
      - static-tarball
      - appimage
      - docker-image
      - release
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete pushed tag
        run: |
          set -euo pipefail
          echo "Deleting tag ${VER} so the same version can be re-run after a fix."
          git push origin ":refs/tags/${VER}"
